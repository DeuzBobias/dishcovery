name: dishcovery
description: A personal cooking companion inspired by the Dishcovery user manual.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^10.3.10
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Lobster
      fonts:
        - asset: assets/Lobster.ttf
    - family: DM Sans
      fonts:
        - asset: assets/DMSans.ttf
    - family: DM Serif
      fonts:
        - asset: assets/DMSerifDisplay.ttf
